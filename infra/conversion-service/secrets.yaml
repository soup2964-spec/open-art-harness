# Secret Manager secrets for the conversion-service: NAMES ONLY (no values ever live in this repo).
# Each is mounted as an environment variable (valueFrom.secretKeyRef in cloudrun-service.yaml).
#   gcloud secrets create NAME --replication-policy=automatic
#   gcloud secrets versions add NAME --data-file=-      # paste, Ctrl-D
#   gcloud secrets add-iam-policy-binding NAME \
#     --member=serviceAccount:conversion-service@PROJECT_ID.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor
# Google Ads needs no secret: the service account itself is authorised (Data Manager API scope
# https://www.googleapis.com/auth/datamanager; add the service account as a user in Google Ads).
#
# Live mode refuses to start (naming the variable, never the value) when a secret it needs is missing,
# shorter than it can plausibly be (Stripe and HMAC >= 32 characters, platform tokens >= 8), a Stripe
# endpoint secret without the whsec_ prefix, or a documented example / placeholder value (README and
# Dockerfile examples, "changeme", "example", "0123456789"...). See src/config.ts assertLiveSecret.

always:
  - secret: conversion-service-stripe-webhook-secrets
    env: STRIPE_WEBHOOK_SECRETS
    what: Stripe endpoint signing secret(s), comma-separated, current first (supports rotation).
  - secret: conversion-service-internal-hmac-secrets
    env: INTERNAL_EVENTS_HMAC_SECRETS
    what: HMAC key(s) >= 32 random chars shared with OpenArt's backend for POST /events, GET /value and (without OIDC) /tasks/* (comma-separated for rotation).

live_only:  # add a platform's entries only when it is listed in LIVE_PLATFORMS
  meta:
    - secret: conversion-service-meta-capi-access-token
      env: META_CAPI_ACCESS_TOKEN
      what: Conversions API system-user access token for pixel 843671884361709.
  tiktok:
    - secret: conversion-service-tiktok-events-access-token
      env: TIKTOK_EVENTS_ACCESS_TOKEN
      what: Events API access token generated in Events Manager for pixel D9QOQ5JC77U6RO6J21IG (sent as Access-Token).
  reddit:
    - secret: conversion-service-reddit-conversion-access-token
      env: REDDIT_CONVERSION_ACCESS_TOKEN
      what: Reddit conversion access token (scope adsconversions) for pixel a2_j6xo78gpljnf.
  linkedin:
    - secret: conversion-service-linkedin-access-token
      env: LINKEDIN_ACCESS_TOKEN
      what: LinkedIn member token with rw_conversions (and r_ads) on the ad account. Expires; rotate.
  x:
    - secret: conversion-service-x-consumer-key
      env: X_CONSUMER_KEY
    - secret: conversion-service-x-consumer-secret
      env: X_CONSUMER_SECRET
    - secret: conversion-service-x-access-token
      env: X_ACCESS_TOKEN
    - secret: conversion-service-x-access-token-secret
      env: X_ACCESS_TOKEN_SECRET
      what: OAuth 1.0a user-context credentials of an Ads API user with AD_MANAGER or ACCOUNT_ADMIN access.
  microsoft:
    - secret: conversion-service-microsoft-uet-capi-token
      env: MICROSOFT_UET_CAPI_TOKEN
      what: UET Conversions API token for tag 187107444 (MICROSOFT_SEND_MODE=uet_capi).
    - secret: conversion-service-microsoft-ads-access-token
      env: MICROSOFT_ADS_ACCESS_TOKEN
      what: Microsoft Advertising OAuth access token (MICROSOFT_SEND_MODE=offline_conversions and/or MICROSOFT_ADJUSTMENTS=online_conversion_adjustments). Short-lived; refresh outside the service.
    - secret: conversion-service-microsoft-ads-developer-token
      env: MICROSOFT_ADS_DEVELOPER_TOKEN
      what: Microsoft Advertising developer token (offline import and/or adjustments).
