# GitHub Actions alternative to the Cloud Run job. To activate, copy this file to the repository
# root at .github/workflows/watchdog.yml (it lives under infra/ so nothing runs until OpenArt opts in).
# Secrets: WATCHDOG_SLACK_WEBHOOK_URL (Slack incoming webhook). Nothing is deployed.
name: openart-signal-watchdog

on:
  schedule:
    - cron: '15 13 * * *' # daily 13:15 UTC (06:15 PDT)
  workflow_dispatch:
    inputs:
      journeys:
        description: 'Comma-separated journey ids (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: openart-signal-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (monorepo lockfile)
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Install Google Chrome (stable)
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Fetch uBlock Origin default lists
        run: bash packages/watchdog/scripts/fetch-blocklists.sh packages/watchdog/blocklists
      - name: Unit tests (includes the hermetic loopback seal test)
        working-directory: packages/watchdog
        env:
          WATCHDOG_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          WATCHDOG_CHROME_ARGS: --no-sandbox --disable-dev-shm-usage
        run: npx vitest run
      - name: Run watchdog (live, sealed)
        env:
          WATCHDOG_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          # Ubuntu 24.04 restricts unprivileged user namespaces; the runner VM is the sandbox.
          WATCHDOG_CHROME_ARGS: --no-sandbox --disable-dev-shm-usage
          JOURNEYS: ${{ inputs.journeys }}
        run: npx tsx packages/watchdog/src/cli.ts run --target live --out "$RUNNER_TEMP/watchdog" ${JOURNEYS:+--journeys "$JOURNEYS"}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-report
          path: ${{ runner.temp }}/watchdog
          retention-days: 30
      - name: Slack alert on FAIL/ERROR, container change or unreadable container, run errors, unproven zero-leak
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WATCHDOG_SLACK_WEBHOOK_URL }}
          WATCHDOG_REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # fail-closed: a run that produced no results is a failure, not silence
          [ -f "$RUNNER_TEMP/watchdog/results.json" ] || { echo '::error::no results.json (the run crashed or the seal self-test failed before any openart.ai traffic)'; exit 1; }
          npx tsx packages/watchdog/src/cli.ts alert --in "$RUNNER_TEMP/watchdog/results.json" --slack-webhook-env SLACK_WEBHOOK_URL
