  - name: adjustments_link_through_purchase_keys_and_net_disputes
    description: >
      Refunds and disputes find their purchase through every key the purchase itself holds, and a
      dispute never takes back more than is left (database review 2 and 3):
        ch_1  refunded in full, THEN disputed          -> refund -3400; the dispute nets to 0: no ledger event
        in_2  has no invoice_payment.paid (legacy invoice.payment_intent pi_2): refund 400 links
              through the purchase's own payment intent; its dispute of 1400 nets to 1000
        ch_9  legacy charge on in_4, dispute won         -> no ledger event (funds reinstated)
        pi_3  pack disputed and lost                     -> chargeback -999
        ch_x  refund of a charge no purchase knows       -> kept, unlinked (quarantined downstream)
      restated_order_value_minor never goes below zero.
    model: int_stripe__adjustments
    given:
      - input: ref('int_stripe__purchases')
        format: dict
        rows:
          - {event_id: purchase_in_1, order_id: sub_in_1, event_name: purchase_first, occurred_at: '2026-06-01 10:00:00', user_id: u1, invoice_id: in_1, subscription_id: sub_1, payment_intent_id: pi_1, charge_id: null, cash_value_minor: 3400, revenue_minor: 3400, currency: USD, plan_tier: advanced, plan_tier_code: 2000, billing_interval: month}
          - {event_id: purchase_in_2, order_id: sub_in_2, event_name: purchase_first, occurred_at: '2026-06-02 10:00:00', user_id: u2, invoice_id: in_2, subscription_id: sub_2, payment_intent_id: pi_2, charge_id: null, cash_value_minor: 1400, revenue_minor: 1400, currency: USD, plan_tier: essential, plan_tier_code: 1000, billing_interval: month}
          - {event_id: purchase_cs_live_3, order_id: sub_cs_live_3, event_name: purchase_one_time_pack, occurred_at: '2026-06-03 10:00:00', user_id: u3, invoice_id: null, subscription_id: null, payment_intent_id: pi_3, charge_id: null, cash_value_minor: 999, revenue_minor: 999, currency: USD, plan_tier: null, plan_tier_code: null, billing_interval: null}
          - {event_id: purchase_in_4, order_id: sub_in_4, event_name: purchase_first, occurred_at: '2026-06-04 10:00:00', user_id: u4, invoice_id: in_4, subscription_id: sub_4, payment_intent_id: null, charge_id: ch_9, cash_value_minor: 1400, revenue_minor: 1400, currency: USD, plan_tier: essential, plan_tier_code: 1000, billing_interval: month}
      - input: ref('stg_stripe__invoice_payments')
        format: dict
        rows:
          - {invoice_payment_id: inpay_1, invoice_id: in_1, payment_intent_id: pi_1, charge_id: ch_1, payment_created_at: '2026-06-01 10:00:00'}
      - input: ref('stg_stripe__refunds')
        format: dict
        rows:
          - {stripe_event_id: evt_r1, refunded_at: '2026-06-05 10:00:00', charge_id: ch_1, user_id: u1, payment_intent_id: pi_1, legacy_invoice_id: null, amount_refunded_cumulative_minor: 3400, refund_step_minor: 3400, currency: USD}
          - {stripe_event_id: evt_r2, refunded_at: '2026-06-06 10:00:00', charge_id: ch_2, user_id: u2, payment_intent_id: pi_2, legacy_invoice_id: null, amount_refunded_cumulative_minor: 400, refund_step_minor: 400, currency: USD}
          - {stripe_event_id: evt_rx, refunded_at: '2026-06-07 10:00:00', charge_id: ch_x, user_id: u9, payment_intent_id: pi_x, legacy_invoice_id: null, amount_refunded_cumulative_minor: 100, refund_step_minor: 100, currency: USD}
      - input: ref('stg_stripe__disputes')
        format: dict
        rows:
          - {dispute_id: dp_1, stripe_event_id: evt_d1, disputed_at: '2026-06-10 10:00:00', charge_id: ch_1, payment_intent_id: pi_1, amount_minor: 3400, currency: USD, dispute_reason: fraudulent, dispute_status: needs_response, is_money_lost: true}
          - {dispute_id: dp_2, stripe_event_id: evt_d2, disputed_at: '2026-06-12 10:00:00', charge_id: ch_2, payment_intent_id: pi_2, amount_minor: 1400, currency: USD, dispute_reason: general, dispute_status: lost, is_money_lost: true}
          - {dispute_id: dp_3, stripe_event_id: evt_d3, disputed_at: '2026-06-13 10:00:00', charge_id: ch_9, payment_intent_id: null, amount_minor: 1400, currency: USD, dispute_reason: general, dispute_status: won, is_money_lost: false}
          - {dispute_id: dp_4, stripe_event_id: evt_d4, disputed_at: '2026-06-14 10:00:00', charge_id: ch_3, payment_intent_id: pi_3, amount_minor: 999, currency: USD, dispute_reason: product_not_received, dispute_status: lost, is_money_lost: true}
      - input: ref('int_fx__rates')
        format: dict
        rows:
          - {currency: USD, reporting_currency: USD, valid_from: '2020-01-01', valid_to: null, reporting_per_unit: 1.0, minor_unit_digits: 2}
