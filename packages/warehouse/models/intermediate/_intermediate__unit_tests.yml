        - {event_id: chargeback_dp_3, event_name: chargeback, adjusts_event_id: purchase_in_4, cash_value_minor: -1400, ledger_cash_value_minor: 0, is_ledger_event: false, restated_order_value_minor: 1400, cash_value_reporting: 0.0, disposition: dispute_won_or_inquiry}
        - {event_id: chargeback_dp_4, event_name: chargeback, adjusts_event_id: purchase_cs_live_3, cash_value_minor: -999, ledger_cash_value_minor: -999, is_ledger_event: true, restated_order_value_minor: 0, cash_value_reporting: -9.99, disposition: chargeback}

  - name: subscription_status_uses_the_line_service_period_not_the_invoice_period
    description: >
      Real Stripe (database review 1): a subscription_cycle invoice's own period_start/period_end
      cover the PREVIOUS period (the usage it bills for); the new term is on the subscription line
      (lines.data[].period). The fixture builder writes the new term at invoice level, so the old
      max(period_end) looked right on fixtures while every real subscriber read `lapsed`.
      sub_active renewed 2026-09-10 for 09-10..10-10 (invoice-level period 08-10..09-10): active
      at the 09-28 as-of. sub_lapsed's last line ended 09-01: lapsed. A proration line (upgrade
      credit) never extends the term. sub_gone was deleted: canceled.
    model: int_stripe__subscription_status
    overrides:
      vars:
        as_of_timestamp: '2026-09-28 00:00:00'
    given:
      - input: ref('stg_stripe__invoices')
        format: dict
        rows:
          - {invoice_id: in_a1, user_id: u1, subscription_id: sub_active, invoice_status: paid, paid_at: '2026-08-10 00:00:00', period_start: '2026-07-10 00:00:00', period_end: '2026-08-10 00:00:00'}
          - {invoice_id: in_a2, user_id: u1, subscription_id: sub_active, invoice_status: paid, paid_at: '2026-09-10 00:00:00', period_start: '2026-08-10 00:00:00', period_end: '2026-09-10 00:00:00'}
          - {invoice_id: in_l1, user_id: u2, subscription_id: sub_lapsed, invoice_status: paid, paid_at: '2026-08-01 00:00:00', period_start: '2026-07-01 00:00:00', period_end: '2026-08-01 00:00:00'}
          - {invoice_id: in_l2, user_id: u2, subscription_id: sub_lapsed, invoice_status: paid, paid_at: '2026-08-20 00:00:00', period_start: '2026-08-20 00:00:00', period_end: '2026-08-20 00:00:00'}
          - {invoice_id: in_g1, user_id: u3, subscription_id: sub_gone, invoice_status: paid, paid_at: '2026-09-05 00:00:00', period_start: '2026-08-05 00:00:00', period_end: '2026-09-05 00:00:00'}
      - input: ref('stg_stripe__invoice_lines')
        format: dict
        rows:
          - {invoice_id: in_a1, line_id: la1, is_proration: false, line_period_start: '2026-08-10 00:00:00', line_period_end: '2026-09-10 00:00:00'}
          - {invoice_id: in_a2, line_id: la2, is_proration: false, line_period_start: '2026-09-10 00:00:00', line_period_end: '2026-10-10 00:00:00'}
          - {invoice_id: in_l1, line_id: ll1, is_proration: false, line_period_start: '2026-08-01 00:00:00', line_period_end: '2026-09-01 00:00:00'}
          - {invoice_id: in_l2, line_id: ll2, is_proration: true, line_period_start: '2026-08-20 00:00:00', line_period_end: '2026-12-01 00:00:00'}
          - {invoice_id: in_g1, line_id: lg1, is_proration: false, line_period_start: '2026-09-05 00:00:00', line_period_end: '2026-10-05 00:00:00'}
      - input: ref('stg_stripe__subscription_events')
