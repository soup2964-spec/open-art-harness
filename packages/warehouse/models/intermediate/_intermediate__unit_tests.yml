      credits at $0.004 with the arms' measured $0.002 (2000 pseudo-credits) = $0.00203922; fees
      36.6 x 3% + 2.44 x ($0.30 + 0.5% x $15); refund risk 1.5% of revenue. Interval: 0 renewals with
