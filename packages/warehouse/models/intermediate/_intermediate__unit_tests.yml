unit_tests:
  - name: purchases_classified_from_billing_reason_and_lines
    description: >
      One Plus subscription through its life, plus a one-time pack and two invoices that must not
      become purchases in silence:
        in_1First   subscription_create                 -> purchase_first (is_first_purchase, checkout session)
        in_1AddOn   subscription_update, CreditPack line -> purchase_add_on, tier from subscription state, 1 pack
        in_1Upgrade subscription_update, -Plus/+Pro lines -> purchase_upgrade infinite, previous advanced
        in_1Renew   subscription_cycle, Pro + 1 pack     -> purchase_renewal, credit_pack_quantity 1
        in_1Weird   billing_reason manual                -> kept with event_name NULL (fails a not_null test)
        in_1Zero    $0 invoice                            -> not a purchase
        cs_live_1Pack payment-mode Checkout              -> purchase_one_time_pack, not first (after in_1First)
    model: int_stripe__purchases
    given:
      - input: ref('stg_stripe__checkout_sessions')
        format: dict
        rows:
          - {checkout_session_id: cs_live_1Sub, completed_event_id: evt_cs1, completed_at: '2026-06-15 12:00:01', session_status: complete, payment_status: paid, checkout_mode: subscription, user_id: u1, subscription_id: sub_1S, invoice_id: in_1First, payment_intent_id: null, amount_total_minor: 3400, currency: USD}
          - {checkout_session_id: cs_live_1Pack, completed_event_id: evt_cs2, completed_at: '2026-06-20 10:00:00', session_status: complete, payment_status: paid, checkout_mode: payment, user_id: u1, subscription_id: null, invoice_id: null, payment_intent_id: pi_3Pack, amount_total_minor: 999, currency: USD}
      - input: ref('stg_stripe__invoices')
        format: dict
        rows:
          - {invoice_id: in_1First, paid_event_id: evt_i1, invoice_status: paid, user_id: u1, subscription_id: sub_1S, billing_reason: subscription_create, currency: USD, amount_paid_minor: 3400, paid_at: '2026-06-15 12:00:00'}
          - {invoice_id: in_1AddOn, paid_event_id: evt_i2, invoice_status: paid, user_id: u1, subscription_id: sub_1S, billing_reason: subscription_update, currency: USD, amount_paid_minor: 1000, paid_at: '2026-06-25 12:00:00'}
          - {invoice_id: in_1Upgrade, paid_event_id: evt_i3, invoice_status: paid, user_id: u1, subscription_id: sub_1S, billing_reason: subscription_update, currency: USD, amount_paid_minor: 734, paid_at: '2026-07-05 12:00:00'}
          - {invoice_id: in_1Renew, paid_event_id: evt_i4, invoice_status: paid, user_id: u1, subscription_id: sub_1S, billing_reason: subscription_cycle, currency: USD, amount_paid_minor: 7100, paid_at: '2026-07-15 12:00:00'}
          - {invoice_id: in_1Weird, paid_event_id: evt_i5, invoice_status: paid, user_id: u1, subscription_id: sub_1S, billing_reason: manual, currency: USD, amount_paid_minor: 500, paid_at: '2026-07-20 12:00:00'}
          - {invoice_id: in_1Zero, paid_event_id: evt_i6, invoice_status: paid, user_id: u1, subscription_id: sub_1S, billing_reason: subscription_create, currency: USD, amount_paid_minor: 0, paid_at: '2026-06-01 12:00:00'}
      - input: ref('stg_stripe__invoice_lines')
        format: dict
        rows:
          - {invoice_id: in_1First, line_id: il_1, amount_minor: 3400, quantity: 1, price_id: price_1TvuqQKVhG51tYSBesVOM0JO}
          - {invoice_id: in_1AddOn, line_id: il_2, amount_minor: 1000, quantity: 1, price_id: price_SYNTHcreditPack5kMonth}
          - {invoice_id: in_1Upgrade, line_id: il_3, amount_minor: -1133, quantity: 1, price_id: price_1TvuqQKVhG51tYSBesVOM0JO}
          - {invoice_id: in_1Upgrade, line_id: il_4, amount_minor: 1867, quantity: 1, price_id: price_1QPKxIKVhG51tYSBcgKOHs5y}
          - {invoice_id: in_1Renew, line_id: il_5, amount_minor: 5600, quantity: 1, price_id: price_1QPKxIKVhG51tYSBcgKOHs5y}
          - {invoice_id: in_1Renew, line_id: il_6, amount_minor: 1500, quantity: 1, price_id: price_SYNTHcreditPack5kMonth}
          - {invoice_id: in_1Weird, line_id: il_7, amount_minor: 500, quantity: 1, price_id: price_1TvuqQKVhG51tYSBesVOM0JO}
      - input: ref('plan_catalog')
        format: dict
        rows:
          - {price_id: price_1TvuqQKVhG51tYSBesVOM0JO, item_type: plan, plan_tier: advanced, billing_interval: month, unit_amount_minor: 3400, plan_tier_code: 2000}
          - {price_id: price_1QPKxIKVhG51tYSBcgKOHs5y, item_type: plan, plan_tier: infinite, billing_interval: month, unit_amount_minor: 5600, plan_tier_code: 3000}
          - {price_id: price_SYNTHcreditPack5kMonth, item_type: credit_pack, plan_tier: null, billing_interval: month, unit_amount_minor: 1500, plan_tier_code: null}
      - input: ref('stg_stripe__subscription_events')
        format: dict
        rows:
          - {stripe_event_id: evt_s1, subscription_id: sub_1S, changed_at: '2026-06-25 12:00:00'}
          - {stripe_event_id: evt_s2, subscription_id: sub_1S, changed_at: '2026-07-05 12:00:00'}
      - input: ref('stg_stripe__subscription_items')
        format: dict
        rows:
          - {stripe_event_id: evt_s1, price_id: price_1TvuqQKVhG51tYSBesVOM0JO, quantity: 1}
          - {stripe_event_id: evt_s1, price_id: price_SYNTHcreditPack5kMonth, quantity: 1}
          - {stripe_event_id: evt_s2, price_id: price_1QPKxIKVhG51tYSBcgKOHs5y, quantity: 1}
          - {stripe_event_id: evt_s2, price_id: price_SYNTHcreditPack5kMonth, quantity: 1}
      - input: ref('stg_stripe__invoice_payments')
        format: dict
        rows:
          - {invoice_payment_id: inpay_1, invoice_id: in_1First, payment_intent_id: pi_3First, charge_id: null, payment_created_at: '2026-06-15 12:00:00'}
      - input: ref('int_fx__rates')
        format: dict
        rows:
          - {currency: USD, reporting_currency: USD, valid_from: '2020-01-01', valid_to: null, reporting_per_unit: 1.0, minor_unit_digits: 2}
    expect:
      format: dict
      rows:
        - {event_id: purchase_in_1First, order_id: sub_in_1First, event_name: purchase_first, classification_rule: billing_reason_subscription_create, cash_value_minor: 3400, plan_tier: advanced, plan_tier_code: 2000, billing_interval: month, previous_plan_tier: null, credit_pack_quantity: null, is_first_purchase: true, checkout_session_id: cs_live_1Sub, payment_intent_id: pi_3First}
        - {event_id: purchase_in_1AddOn, order_id: sub_in_1AddOn, event_name: purchase_add_on, classification_rule: credit_pack_line, cash_value_minor: 1000, plan_tier: advanced, plan_tier_code: 2000, billing_interval: month, previous_plan_tier: null, credit_pack_quantity: 1, is_first_purchase: false, checkout_session_id: null, payment_intent_id: null}
        - {event_id: purchase_in_1Upgrade, order_id: sub_in_1Upgrade, event_name: purchase_upgrade, classification_rule: plan_change_lines, cash_value_minor: 734, plan_tier: infinite, plan_tier_code: 3000, billing_interval: month, previous_plan_tier: advanced, credit_pack_quantity: 1, is_first_purchase: false, checkout_session_id: null, payment_intent_id: null}
        - {event_id: purchase_in_1Renew, order_id: sub_in_1Renew, event_name: purchase_renewal, classification_rule: billing_reason_recurring, cash_value_minor: 7100, plan_tier: infinite, plan_tier_code: 3000, billing_interval: month, previous_plan_tier: null, credit_pack_quantity: 1, is_first_purchase: false, checkout_session_id: null, payment_intent_id: null}
        - {event_id: purchase_in_1Weird, order_id: sub_in_1Weird, event_name: null, classification_rule: unclassified_billing_reason, cash_value_minor: 500, plan_tier: advanced, plan_tier_code: 2000, billing_interval: month, previous_plan_tier: null, credit_pack_quantity: null, is_first_purchase: false, checkout_session_id: null, payment_intent_id: null}
        - {event_id: purchase_cs_live_1Pack, order_id: sub_cs_live_1Pack, event_name: purchase_one_time_pack, classification_rule: payment_mode_checkout, cash_value_minor: 999, plan_tier: null, plan_tier_code: null, billing_interval: null, previous_plan_tier: null, credit_pack_quantity: null, is_first_purchase: false, checkout_session_id: cs_live_1Pack, payment_intent_id: pi_3Pack}

  - name: purchases_convert_to_the_reporting_currency_point_in_time_and_net_of_tax
    description: >
      Money reaches the profit models in the reporting currency (USD), tax-exclusive, converted
      at the rate valid on the purchase date. in_Usd pays 11.00 with 1.00 tax -> revenue 10.00;
      in_EurJun / in_EurJul pay 10.00 EUR either side of a rate change (1.08 then 1.10);
      in_Jpy pays 1400 JPY, a zero-decimal currency (1,400 yen x 0.0067 = 9.38, not 14.00);
      cs_live_Gbp is a pack paid 12.00 GBP incl. 2.00 tax; in_Xyz has no rate -> NULL values.
    model: int_stripe__purchases
    given:
      - input: ref('stg_stripe__checkout_sessions')
        format: dict
        rows:
          - {checkout_session_id: cs_live_Gbp, completed_event_id: evt_cs, completed_at: '2026-06-20 10:00:00', session_status: complete, payment_status: paid, checkout_mode: payment, user_id: u1, subscription_id: null, invoice_id: null, payment_intent_id: pi_Gbp, amount_total_minor: 1200, amount_tax_minor: 200, currency: GBP}
      - input: ref('stg_stripe__invoices')
        format: dict
        rows:
          - {invoice_id: in_Usd, paid_event_id: e1, invoice_status: paid, user_id: u1, subscription_id: sub_1, billing_reason: subscription_create, currency: USD, amount_paid_minor: 1100, total_minor: 1100, total_excluding_tax_minor: 1000, paid_at: '2026-06-01 12:00:00'}
          - {invoice_id: in_EurJun, paid_event_id: e2, invoice_status: paid, user_id: u2, subscription_id: sub_2, billing_reason: subscription_create, currency: EUR, amount_paid_minor: 1000, total_minor: 1000, total_excluding_tax_minor: 1000, paid_at: '2026-06-15 12:00:00'}
          - {invoice_id: in_EurJul, paid_event_id: e3, invoice_status: paid, user_id: u2, subscription_id: sub_2, billing_reason: subscription_cycle, currency: EUR, amount_paid_minor: 1000, total_minor: 1000, total_excluding_tax_minor: null, paid_at: '2026-07-15 12:00:00'}
          - {invoice_id: in_Jpy, paid_event_id: e4, invoice_status: paid, user_id: u3, subscription_id: sub_3, billing_reason: subscription_create, currency: JPY, amount_paid_minor: 1400, total_minor: 1400, total_excluding_tax_minor: 1400, paid_at: '2026-06-02 12:00:00'}
          - {invoice_id: in_Xyz, paid_event_id: e5, invoice_status: paid, user_id: u4, subscription_id: sub_4, billing_reason: subscription_create, currency: XYZ, amount_paid_minor: 500, total_minor: 500, total_excluding_tax_minor: 500, paid_at: '2026-06-02 12:00:00'}
      - input: ref('stg_stripe__invoice_lines')
        format: dict
        rows:
          - {invoice_id: in_Usd, line_id: l1, amount_minor: 1100, quantity: 1, price_id: p_ess}
      - input: ref('plan_catalog')
        format: dict
        rows:
          - {price_id: p_ess, item_type: plan, plan_tier: essential, billing_interval: month, unit_amount_minor: 1400, plan_tier_code: 1000}
      - input: ref('stg_stripe__subscription_events')
        format: dict
        rows: []
      - input: ref('stg_stripe__subscription_items')
        format: dict
        rows: []
      - input: ref('stg_stripe__invoice_payments')
        format: dict
        rows: []
      - input: ref('int_fx__rates')
        format: dict
        rows:
          - {currency: USD, reporting_currency: USD, valid_from: '2020-01-01', valid_to: null, reporting_per_unit: 1.0, minor_unit_digits: 2}
          - {currency: EUR, reporting_currency: USD, valid_from: '2020-01-01', valid_to: '2026-07-01', reporting_per_unit: 1.08, minor_unit_digits: 2}
          - {currency: EUR, reporting_currency: USD, valid_from: '2026-07-01', valid_to: null, reporting_per_unit: 1.10, minor_unit_digits: 2}
          - {currency: JPY, reporting_currency: USD, valid_from: '2020-01-01', valid_to: null, reporting_per_unit: 0.0067, minor_unit_digits: 0}
          - {currency: GBP, reporting_currency: USD, valid_from: '2020-01-01', valid_to: null, reporting_per_unit: 1.27, minor_unit_digits: 2}
    expect:
      format: dict
      rows:
        - {event_id: purchase_in_Usd, cash_value_minor: 1100, revenue_minor: 1000, reporting_currency: USD, cash_value_reporting: 11.0, revenue_reporting: 10.0}
        - {event_id: purchase_in_EurJun, cash_value_minor: 1000, revenue_minor: 1000, reporting_currency: USD, cash_value_reporting: 10.8, revenue_reporting: 10.8}
        - {event_id: purchase_in_EurJul, cash_value_minor: 1000, revenue_minor: 1000, reporting_currency: USD, cash_value_reporting: 11.0, revenue_reporting: 11.0}
        - {event_id: purchase_in_Jpy, cash_value_minor: 1400, revenue_minor: 1400, reporting_currency: USD, cash_value_reporting: 9.38, revenue_reporting: 9.38}
