  - name: arm_readout_counts_everyone_and_widens_for_model_error
    description: >
      ML review 5 and 6 on a toy flag. Arm A: 4 exposed (one contaminated, kept), 3 scored, 2 matured.
      Predicted mean (100 + 2 + 4) / 3 = 35.333; realised mean over matured users only (80 + 0) / 2 =
      40; mean residual -11 -> prediction-powered estimate 24.333. Fewer than 30 matured users in the
      arm, so the model-error variance is the flag's pooled residual variance / its count =
      99.583 / 4 -> SE 4.989572. Stratified on early payers (flag share 1 of 5 = 0.2):
      0.2 x 100 + 0.8 x 3 = 22.4. Arm B has no early payer: stratified = plain mean.
    model: fct_experiment_profit_by_arm
    overrides:
      vars:
        readout_bootstrap_replicates: 0
        readout_min_matured_for_arm_error: 30
    given:
      - input: ref('int_experiment__user_readout')
