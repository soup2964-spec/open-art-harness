      - input: ref('stg_app__credit_ledger_details')
        format: dict
        rows:
          - {ledger_entry_id: g1, detail_position: 0, quantity: 1, unit_credits: 400, sub_business_type: 'byte-plus-seedance-2:text2video', original_unit_credits: null, discount_pct: null, generation_source: null}
          - {ledger_entry_id: g2, detail_position: 0, quantity: 1, unit_credits: 1000, sub_business_type: 'byte-plus-seedance-2:text2video', original_unit_credits: null, discount_pct: null, generation_source: null}
          - {ledger_entry_id: g3, detail_position: 0, quantity: 1, unit_credits: 0, sub_business_type: 'byte-plus-seedance-2:text2video', original_unit_credits: 400, discount_pct: null, generation_source: null}
