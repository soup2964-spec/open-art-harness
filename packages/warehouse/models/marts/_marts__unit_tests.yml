          - {ledger_entry_id: g5, detail_position: 0, quantity: 1, unit_credits: 300, sub_business_type: 'mystery-model:text2video', original_unit_credits: null, discount_pct: null, generation_source: null}
      - input: ref('int_model_costs__priced')
