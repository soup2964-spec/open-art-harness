unit_tests:
  - name: generation_cost_override_precedence_and_discount
    description: >
      Cost basis precedence and the discount hook. Five generations of one capability:
        g1 exact setting at list price minus the vendor discount (25% for byteplus via vars)
        g2 setting-specific override with a realised unit cost (no further discount)
        g3 "Unlimited" promo (unitCredits 0) costed at originalUnitCredits' setting
        g4 failed generation (credits refunded) billed at failed_generation_cost_share (0.5 here)
        g5 unknown capability at default_cost_per_credit_usd
    model: fct_generation_cost
    overrides:
      vars:
        vendor_discounts: {byteplus: 0.25}
        failed_generation_cost_share: 0.5
        default_cost_per_credit_usd: 0.002
    given:
      - input: ref('stg_app__credit_ledger')
        format: dict
        rows:
          - {ledger_entry_id: g1, user_id: u1, created_at: '2026-07-01 10:00:00', entry_type: CONSUME, business_type: 'byte-plus-seedance-2:text2video', business_id: h1, amount: -400, credit_field: subscription_monthly_credit, is_generation: true, model_id: byte-plus-seedance-2, generation_mode: text2video, media_type: video}
          - {ledger_entry_id: g2, user_id: u1, created_at: '2026-07-02 10:00:00', entry_type: CONSUME, business_type: 'byte-plus-seedance-2:text2video', business_id: h2, amount: -1000, credit_field: subscription_monthly_credit, is_generation: true, model_id: byte-plus-seedance-2, generation_mode: text2video, media_type: video}
          - {ledger_entry_id: g3, user_id: u1, created_at: '2026-07-03 10:00:00', entry_type: CONSUME, business_type: 'byte-plus-seedance-2:text2video', business_id: h3, amount: 0, credit_field: subscription_monthly_credit, is_generation: true, model_id: byte-plus-seedance-2, generation_mode: text2video, media_type: video}
          - {ledger_entry_id: g4, user_id: u1, created_at: '2026-07-04 10:00:00', entry_type: CONSUME, business_type: 'byte-plus-seedance-2:text2video', business_id: h4, amount: -400, credit_field: subscription_monthly_credit, is_generation: true, model_id: byte-plus-seedance-2, generation_mode: text2video, media_type: video}
