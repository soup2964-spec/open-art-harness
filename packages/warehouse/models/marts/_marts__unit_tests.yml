  - name: predicted_profit_components_for_a_monthly_payer_and_an_unpaid_user
    description: >
      Hand-computed v0 arithmetic of the 24h score (int_pp__scores), both users in fold 0, so both
      are scored with the xf0 fit (cross-fitting). u_paid bought Starter monthly ($14) within 24h:
      revenue 14 x (1 + 0.8 + 0.64) = 34.16; charges 2.44; credits 4000 x 0.5 x 2.44 = 4880 at the
      MEASURED arm mix (0.5 x 0.003 video + 0.5 x 0.001 image = 0.002 $/credit) = 9.76 (+ 0.10
      realised). u_free (affiliate) generated but kept trial credits: signals-only P = 0.1; with
      the arm terms (cal, the main variant here) P = 0.1 x 1.2 = 0.12 -> revenue 0.12 x 300 x 1.5 = 54.
      p * value_if_converted - unconditional_cost = predicted_profit for both.
    model: int_pp__scores
    overrides:
      vars:
        pp_monthly_retention: 0.8
        pp_use_arm_calibration: true
        pp_plan_utilization: 0.5
        pp_trial_leftover_use_share: 0.0
        payment_fee_pct: 0.03
        payment_fee_fixed_usd: 0.3
        affiliate_commission_pct: 0.2
        pp_refund_prob_per_charge: 0.02
        pp_chargeback_prob_per_charge: 0.0
        dispute_fee_usd: 15.0
        default_cost_per_credit_usd: 0.002
        as_of_timestamp: '2026-09-28 00:00:00'
    given:
      - input: ref('fct_user_features_24h')
        format: dict
        rows:
          - {user_id: u_paid, signup_at: '2026-07-01 00:00:00', feature_window_end: '2026-07-02 00:00:00', is_window_complete: true, cf_fold: 0, signup_week: '2026-06-29', paid_within_24h: true, activated_24h: true, trial_depleted_24h: false, first_purchase_event_name: purchase_first, plan_tier: essential, billing_interval: month, first_purchase_value_usd: 14.0, generation_cost_24h_usd: 0.1, trial_credits_remaining_24h: 0, arm_create_image: img_a, arm_create_video: vid_a, acquisition_channel: organic, is_qa_account: false}
          - {user_id: u_free, signup_at: '2026-07-01 00:00:00', feature_window_end: '2026-07-02 00:00:00', is_window_complete: true, cf_fold: 0, signup_week: '2026-06-29', paid_within_24h: false, activated_24h: true, trial_depleted_24h: false, first_purchase_event_name: null, plan_tier: null, billing_interval: null, first_purchase_value_usd: null, generation_cost_24h_usd: 0.02, trial_credits_remaining_24h: 20, arm_create_image: img_a, arm_create_video: vid_a, acquisition_channel: affiliate, is_qa_account: false}
      - input: ref('int_pp__oot_weeks')
        format: dict
        rows: []
      - input: ref('int_pp__segment_rates')
        format: dict
        rows:
          - {fit_id: xf0, segment: activated, p_convert: 0.1}
          - {fit_id: xf0, segment: activated_depleted, p_convert: 0.2}
          - {fit_id: xf0, segment: not_activated, p_convert: 0.01}
          - {fit_id: xf1, segment: activated, p_convert: 0.9}
      - input: ref('int_pp__arm_multipliers')
        format: dict
        rows:
          - {fit_id: xf0, flag_key: suite-default-model-create-image, arm: img_a, conversion_multiplier: 1.2, value_multiplier: 1.5}
          - {fit_id: xf0, flag_key: suite-default-model-create-video, arm: vid_a, conversion_multiplier: 1.0, value_multiplier: 1.0}
      - input: ref('int_pp__converter_value')
        format: dict
        rows:
          - {fit_id: xf0, revenue_per_converter_usd: 300.0, charges_per_converter: 2.0, paid_credits_per_converter: 10000.0, paid_video_credit_share: 0.5, trial_cost_per_credit_usd: 0.002}
          - {fit_id: xf1, revenue_per_converter_usd: 9999.0, charges_per_converter: 9.0, paid_credits_per_converter: 1.0, paid_video_credit_share: 0.5, trial_cost_per_credit_usd: 0.002}
      - input: ref('int_pp__cost_per_credit')
        format: dict
        rows:
          - {fit_id: xf0, flag_key: suite-default-model-create-image, arm: img_a, media_type: image, pooled_cost_per_credit_usd: 0.004, cost_per_credit_usd: 0.001}
          - {fit_id: xf0, flag_key: suite-default-model-create-video, arm: vid_a, media_type: video, pooled_cost_per_credit_usd: 0.004, cost_per_credit_usd: 0.003}
      - input: ref('plan_catalog')
        format: dict
        rows:
          - {price_id: p1, item_type: plan, plan_tier: essential, billing_interval: month, monthly_credits: 4000, credits_per_unit: null}
          - {price_id: p2, item_type: one_time_pack, plan_tier: null, billing_interval: null, monthly_credits: null, credits_per_unit: 800}
    expect:
      format: dict
      rows:
        # u_paid: fees 34.16 x 0.03 + 2.44 x 0.3 = 1.7568; risk 34.16 x 0.02 = 0.6832; V = (21.86 + 0.1) / 1
        - {purpose: serve, fit_id: xf0, user_id: u_paid, predicted_revenue: 34.16, predicted_generation_cost: 9.86, predicted_fees: 1.7568, predicted_refund_risk: 0.6832, predicted_profit: 21.86, p_convert: 1.0, sig_predicted_profit: 21.86, unconditional_cost: 0.1, value_if_converted: 21.96}
        # u_free (cal): credits 0.12 x 10000 x 1.5 = 1800 x 0.002 = 3.6 (+0.02); fees 54 x 0.03 + 0.24 x 0.3 + 54 x 0.2 = 12.492;
        #   risk 1.08; V = (36.808 + 0.02) / 0.12 = 306.9. sig: p 0.1 -> 30 - 2.02 - 6.96 - 0.6 = 20.42
        - {purpose: serve, fit_id: xf0, user_id: u_free, predicted_revenue: 54.0, predicted_generation_cost: 3.62, predicted_fees: 12.492, predicted_refund_risk: 1.08, predicted_profit: 36.808, p_convert: 0.12, sig_predicted_profit: 20.42, unconditional_cost: 0.02, value_if_converted: 306.9}

  - name: ledger_attribution_is_what_was_known_at_event_time
    description: >
      Every attribution field on a ledger event is bounded by the event time (+ the
      attribution_clock_skew_seconds allowance, 300 s): u1 buys at 2026-06-10 12:00.
        device      d_old (from 06-01), d_new (from 06-09) -> d_new; d_future (06-11) never
        gclid       A clicked 06-01, C clicked 06-05, B clicked 06-15 (a re-click AFTER the purchase)
                    -> C (the latest click BEFORE the event), not A (first touch), not {} and not B
        fbclid      first seen 06-11 (after the purchase)   -> absent
        utm         utm_source captured 06-01 -> kept; utm_campaign captured 06-20 -> absent
        arms        image exposed 06-01 -> kept; video exposed 06-20 -> absent
      (database review 6 and 7: these bounds had no test; mutations M01-M03b, M19 survived)
    model: fct_conversion_ledger
    overrides:
      vars:
        attribution_clock_skew_seconds: 300
    given:
      - input: ref('int_conversion_ledger__events')
